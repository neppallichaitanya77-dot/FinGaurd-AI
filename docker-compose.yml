version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-finguard}:${POSTGRES_PASSWORD:-finguard_secure_password}@postgres:5432/${POSTGRES_DB:-finguard}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-finguard_super_secret_jwt_key_2026}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
      - AUTO_SEED=true
      - DEMO_USER_EMAIL=demo@finguard.ai
      - DEMO_USER_PASSWORD=demo123
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
